version: 2.1

orbs:
  android: circleci/android@3.1.0
  codecov: codecov/codecov@4.1.0

commands:
  codecov_upload:
    description: Upload Codecov report
    parameters:
      report_path:
        type: string
      flags:
        type: string
    steps:
      - codecov/upload:
          file: << parameters.report_path >>
          flags: << parameters.flags >>

  write_local_properties:
    description: Write local.properties from secret
    steps:
      - run:
          name: Write local.properties
          command: |
            if [ -n "$LOCAL_PROPERTIES" ]; then
              echo "$LOCAL_PROPERTIES" | base64 -d > local.properties
            fi

  write_google_services:
    description: Write google-services.json from secret
    steps:
      - run:
          name: Write google-services.json
          command: |
            if [ -n "$GOOGLE_PLAY_JSON_DEVELOPMENT" ]; then
              echo "$GOOGLE_PLAY_JSON_DEVELOPMENT" | base64 -d > app/google-services.json
            fi

  run_android_test:
    description: Run Android instrumentation test
    parameters:
      gradle_task:
        type: string
    steps:
      - run:
          name: Run Android instrumentation test
          command: |
            adb logcat -c
            adb logcat > logcat.txt &

            ./gradlew << parameters.gradle_task >> \
              --parallel \
              --max-workers 2 \
              -Dorg.gradle.jvmargs="-Xmx2048m"

  store_android_artifacts:
    description: Store Android artifacts
    steps:
      - store_artifacts:
          path: logcat.txt
          destination: logcat

      - run:
          name: Collect build reports
          when: always
          command: |
            mkdir -p /tmp/build-reports
            find . -type d -path "*/build/reports" | while read -r dir; do
              dest="/tmp/build-reports/$(echo $dir | sed 's/[^a-zA-Z0-9]/_/g')"
              mkdir -p "$dest"
              cp -r "$dir/"* "$dest/" || true
            done

      - store_artifacts:
          path: /tmp/build-reports
          destination: build-reports

# Note: The custom executors: block has been removed to fix the schema error.

jobs:
  unit_test_ui:
    # We define the YAML anchor (&android_exec) here on the first usage
    executor: &android_exec
      name: android/android-machine
      tag: "2024.11.1"
      resource-class: large
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - checkout:
          submodules: true
      - android/restore-gradle-cache
      - run:
          name: UI unit tests
          command: |
            ./gradlew :module:ui:jacocoFdroidTestReport \
              --parallel \
              --max-workers 2 \
              -Dorg.gradle.jvmargs="-Xmx2048m"
      - codecov_upload:
          report_path: ./module/ui/build/reports/jacoco/unitTest.xml
          flags: ui-unitTest
      - android/save-gradle-cache

  unit_test_data_repo_api:
    # We reuse the anchor (*android_exec) for all subsequent jobs
    executor: *android_exec
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - checkout:
          submodules: true
      - android/restore-gradle-cache
      - run:
          name: Data repo API unit tests
          command: |
            ./gradlew :module:data-repo-api:jacocoFdroidTestReport \
              --parallel \
              --max-workers 2 \
              -Dorg.gradle.jvmargs="-Xmx2048m"
      - codecov_upload:
          report_path: ./module/data-repo-api/build/reports/jacoco/unitTest.xml
          flags: data-repo-api-unitTest
      - android/save-gradle-cache

  unit_test_data_common:
    executor: *android_exec
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - checkout:
          submodules: true
      - android/restore-gradle-cache
      - run:
          name: Data common unit tests
          command: |
            ./gradlew :module:data-common:jacocoFdroidTestReport \
              --parallel \
              --max-workers 2 \
              -Dorg.gradle.jvmargs="-Xmx2048m"
      - codecov_upload:
          report_path: ./module/data-common/build/reports/jacoco/unitTest.xml
          flags: data-common-unitTest
      - android/save-gradle-cache

  ui_android_test:
    executor: *android_exec
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - checkout:
          submodules: true
      - android/restore-gradle-cache
      - write_local_properties
      - write_google_services
      - android/create-avd:
          avd-name: testavd
          system-image: system-images;android-36;google_apis;x86_64
      - android/start-emulator:
          avd-name: testavd
          no-window: true
          gpu: swiftshader_indirect
          restore-gradle-cache-prefix: v1a
      - run_android_test:
          gradle_task: ":module:ui:jacocoFdroidAndroidTestReport"
      - codecov_upload:
          report_path: ./module/ui/build/reports/jacoco/androidTest.xml
          flags: ui-androidTest
      - store_android_artifacts
      - android/save-gradle-cache

  app_android_test:
    executor: *android_exec
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - checkout:
          submodules: true
      - android/restore-gradle-cache
      - write_local_properties
      - write_google_services
      - android/create-avd:
          avd-name: testavd
          system-image: system-images;android-36;google_apis;x86_64
      - android/start-emulator:
          avd-name: testavd
          no-window: true
          gpu: swiftshader_indirect
          restore-gradle-cache-prefix: v1a
      - run_android_test:
          gradle_task: ":app:jacocoFdroidAndroidTestReport"
      - codecov_upload:
          report_path: ./app/build/reports/jacoco/androidTest.xml
          flags: app-androidTest
      - store_android_artifacts
      - android/save-gradle-cache

  data_common_android_test:
    executor: *android_exec
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - checkout:
          submodules: true
      - android/restore-gradle-cache
      - write_local_properties
      - write_google_services
      - android/create-avd:
          avd-name: testavd
          system-image: system-images;android-36;google_apis;x86_64
      - android/start-emulator:
          avd-name: testavd
          no-window: true
          gpu: swiftshader_indirect
          restore-gradle-cache-prefix: v1a
      - run_android_test:
          gradle_task: ":module:data-common:jacocoFdroidAndroidTestReport"
      - codecov_upload:
          report_path: ./module/data-common/build/reports/jacoco/androidTest.xml
          flags: data-common-androidTest
      - store_android_artifacts
      - android/save-gradle-cache

  detekt:
    executor: *android_exec
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dsonar.gradle.skipCompile=true"
    steps:
      - checkout:
          submodules: true
      - android/restore-gradle-cache
      - run:
          name: Detekt
          command: |
            ./gradlew detekt \
              -x test \
              --parallel \
              --max-workers 2 \
              -Dorg.gradle.jvmargs="-Xmx2048m"
      - android/save-gradle-cache

  ktlint:
    executor: *android_exec
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dsonar.gradle.skipCompile=true"
    steps:
      - checkout:
          submodules: true
      - android/restore-gradle-cache
      - run:
          name: ktlint
          command: |
            ./gradlew ktlintCheck \
              --parallel \
              --max-workers 2 \
              -Dorg.gradle.jvmargs="-Xmx2048m"
      - android/save-gradle-cache

  lint_fdroid_debug:
    executor: *android_exec
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dsonar.gradle.skipCompile=true"
    steps:
      - checkout:
          submodules: true
      - android/restore-gradle-cache
      - run:
          name: lintFdroidDebug
          command: |
            ./gradlew :app:lintFdroidDebug \
              --parallel \
              --max-workers 2 \
              -Dorg.gradle.jvmargs="-Xmx2048m"
      - android/save-gradle-cache

  sonarqube:
    executor: *android_exec
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dsonar.gradle.skipCompile=true"
    steps:
      - checkout:
          submodules: true
      - run:
          name: Fetch full git history
          command: |
            git fetch --unshallow || true
            git fetch --all --tags --prune
      - run:
          name: Verify git repository
          command: git fsck --full
      - android/restore-gradle-cache
      - run:
          name: SonarQube
          command: |
            if [ -z "$SONAR_TOKEN" ]; then
              echo "SONAR_TOKEN is not set"
              exit 1
            fi
            ./gradlew :sonar --info
      - android/save-gradle-cache

workflows:
  version: 2
  codecov_and_static:
    jobs:
      - unit_test_ui
      - unit_test_data_repo_api
      - unit_test_data_common
      - ui_android_test
      - app_android_test
      - data_common_android_test
      - detekt
      - ktlint
      - lint_fdroid_debug
      - sonarqube
