version: 2.1

orbs:
  android: circleci/android@3.0.1

executors:
  android-docker:
    docker:
      - image: cimg/android:2024.10
    resource_class: large

commands:
  restore_gradle_cache:
    description: Restore Gradle caches.
    steps:
      - restore_cache:
          keys:
            - gradle-cache-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "build.gradle.kts" }}
            - gradle-cache-

  save_gradle_cache:
    description: Save Gradle caches.
    steps:
      - save_cache:
          paths:
            - ~/.gradle
            - ~/.android
          key: gradle-cache-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "build.gradle.kts" }}

  codecov_upload:
    description: Upload Codecov report.
    parameters:
      report_path:
        type: string
      flags:
        type: string
    steps:
      - run:
          name: codecov
          command: |
            if [ -z "$CODECOV_TOKEN" ]; then
              echo "Skipping Codecov upload because CODECOV_TOKEN is not set"
              exit 0
            fi
            bash <(curl -s https://codecov.io/bash) -f "<< parameters.report_path >>" -F "<< parameters.flags >>" -t "$CODECOV_TOKEN"

  write_local_properties:
    description: Write local.properties from secret.
    steps:
      - run:
          name: local.properties
          command: |
            if [ -n "$LOCAL_PROPERTIES" ]; then
              echo "$LOCAL_PROPERTIES" | base64 -d > local.properties
            fi

  write_google_services:
    description: Write google-services.json from secret.
    steps:
      - run:
          name: google-services.json
          command: |
            if [ -n "$GOOGLE_PLAY_JSON_DEVELOPMENT" ]; then
              echo "$GOOGLE_PLAY_JSON_DEVELOPMENT" | base64 -d > app/google-services.json
            fi

  # Reusable command: create + boot emulator with all CI-safe flags
  create_and_boot_emulator:
    description: Create AVD and start emulator with CI-optimised flags.
    steps:
      - android/create_avd:
          avd_name: circleci-android-34
          # google_atd (Automated Test Device) strips Play Services bloat — boots ~2x faster than google_apis
          system_image: "system-images;android-34;google_atd;x86_64"
          install: true
      - android/start_emulator:
          avd_name: circleci-android-34
          no_window: true
          post_emulator_launch_assemble_command: ""
          additional_args: >-
            -no-snapshot-save
            -no-boot-anim
            -no-audio
            -gpu swiftshader_indirect
            -memory 2048
            -cores 2
      - run:
          name: Wait for emulator to fully boot
          command: |
            adb wait-for-device
            # Poll boot completion with a hard 5-minute timeout
            timeout 300 bash -c \
              'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null)" == "1" ]]; do sleep 5; done'
            echo "Emulator boot confirmed"

jobs:
  unit_test_ui:
    executor: android-docker
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - checkout:
          submodules: true
      - restore_gradle_cache
      - run:
          name: ui unit tests
          command: ./gradlew :module:ui:jacocoFdroidTestReport --parallel --max-workers 2 -Dorg.gradle.jvmargs="-Xmx2048m"
      - codecov_upload:
          report_path: ./module/ui/build/reports/jacoco/unitTest.xml
          flags: ui-unitTest
      - save_gradle_cache

  unit_test_data_repo_api:
    executor: android-docker
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - checkout:
          submodules: true
      - restore_gradle_cache
      - run:
          name: data-repo-api unit tests
          command: ./gradlew :module:data-repo-api:jacocoFdroidTestReport --parallel --max-workers 2 -Dorg.gradle.jvmargs="-Xmx2048m"
      - codecov_upload:
          report_path: ./module/data-repo-api/build/reports/jacoco/unitTest.xml
          flags: data-repo-api-unitTest
      - save_gradle_cache

  unit_test_data_common:
    executor: android-docker
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - checkout:
          submodules: true
      - restore_gradle_cache
      - run:
          name: data-common unit tests
          command: ./gradlew :module:data-common:jacocoFdroidTestReport --parallel --max-workers 2 -Dorg.gradle.jvmargs="-Xmx2048m"
      - codecov_upload:
          report_path: ./module/data-common/build/reports/jacoco/unitTest.xml
          flags: data-common-unitTest
      - save_gradle_cache

  ui_android_test:
    executor:
      name: android/android_machine
      resource_class: large
      tag: default
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - checkout:
          submodules: true
      - restore_gradle_cache
      - write_local_properties
      - write_google_services
      - create_and_boot_emulator
      - android/disable_animations
      - android/run_tests:
          test_command: ./gradlew :module:ui:jacocoFdroidAndroidTestReport --parallel --max-workers 2 -Dorg.gradle.jvmargs="-Xmx2048m"
      - codecov_upload:
          report_path: ./module/ui/build/reports/jacoco/androidTest.xml
          flags: ui-androidTest
      - store_artifacts:
          path: "**/build/reports/*"
          destination: build-reports
      - save_gradle_cache

  app_android_test:
    executor:
      name: android/android_machine
      resource_class: large
      tag: default
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - checkout:
          submodules: true
      - restore_gradle_cache
      - write_local_properties
      - write_google_services
      - create_and_boot_emulator
      - android/disable_animations
      - android/run_tests:
          test_command: ./gradlew :app:jacocoFdroidAndroidTestReport --parallel --max-workers 2 -Dorg.gradle.jvmargs="-Xmx2048m"
      - codecov_upload:
          report_path: ./app/build/reports/jacoco/androidTest.xml
          flags: app-androidTest
      - store_artifacts:
          path: "**/build/reports/*"
          destination: build-reports
      - save_gradle_cache

  data_common_android_test:
    executor:
      name: android/android_machine
      resource_class: large
      tag: default
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - checkout:
          submodules: true
      - restore_gradle_cache
      - write_local_properties
      - write_google_services
      - create_and_boot_emulator
      - android/disable_animations
      - android/run_tests:
          test_command: ./gradlew :module:data-common:jacocoFdroidAndroidTestReport --parallel --max-workers 2 -Dorg.gradle.jvmargs="-Xmx2048m"
      - codecov_upload:
          report_path: ./module/data-common/build/reports/jacoco/androidTest.xml
          flags: data-common-androidTest
      - store_artifacts:
          path: "**/build/reports/*"
          destination: build-reports
      - save_gradle_cache

  detekt:
    executor: android-docker
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dsonar.gradle.skipCompile=true"
    steps:
      - checkout:
          submodules: true
      - restore_gradle_cache
      - run:
          name: detekt
          command: ./gradlew detekt -x test --parallel --max-workers 2 -Dorg.gradle.jvmargs="-Xmx2048m"
      - save_gradle_cache

  ktlint:
    executor: android-docker
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dsonar.gradle.skipCompile=true"
    steps:
      - checkout:
          submodules: true
      - restore_gradle_cache
      - run:
          name: ktlint
          command: ./gradlew ktlintCheck --parallel --max-workers 2 -Dorg.gradle.jvmargs="-Xmx2048m"
      - save_gradle_cache

  lint_fdroid_debug:
    executor: android-docker
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dsonar.gradle.skipCompile=true"
    steps:
      - checkout:
          submodules: true
      - restore_gradle_cache
      - run:
          name: lintFdroidDebug
          command: ./gradlew :app:lintFdroidDebug --parallel --max-workers 2 -Dorg.gradle.jvmargs="-Xmx2048m"
      - save_gradle_cache

  sonarqube:
    executor: android-docker
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dsonar.gradle.skipCompile=true"
    steps:
      - checkout:
          submodules: true
      - run:
          name: Unshallow Git History for SonarScanner
          command: |
            # Check if the repository is shallow, and if so, fetch the full history
            if [ -f .git/shallow ]; then
            echo "Shallow repository detected. Fetching full history..."
            git fetch --unshallow --recurse-submodules=no
            else
            echo "Repository is already complete."
            fi
      - run:
          name: Fetch full git history
          command: |
            git fetch --unshallow || git fetch --all
            git submodule foreach --recursive \
              'git fetch --unshallow || git fetch --all || true'

            git fetch --all --tags --prune
      - run:
          name: Verify git repository
          command: git fsck --full
      - restore_gradle_cache
      - run:
          name: sonar
          command: |
            if [ -z "$SONAR_TOKEN" ]; then
              echo "SONAR_TOKEN is not set; please configure SONAR_TOKEN in CircleCI project settings"
              exit 1
            fi
            ./gradlew :sonar --info
      - save_gradle_cache

workflows:
  version: 2
  codecov_and_static:
    jobs:
      - unit_test_ui
      - unit_test_data_repo_api
      - unit_test_data_common
      - ui_android_test
      - app_android_test
      - data_common_android_test
      - detekt
      - ktlint
      - lint_fdroid_debug
      - sonarqube
