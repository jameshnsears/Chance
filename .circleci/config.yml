version: 2.1

orbs:
  android: circleci/android@3.1.0
  codecov: codecov/codecov@4.1.0

# FIX 1 (style): Keep the executor anchor but note it is only valid because
# CircleCI merges the map under the `executor:` key at job level.
android_exec: &android_exec
  name: android/android_machine
  resource_class: large
  tag: default

commands:
  codecov_upload:
    parameters:
      report_path:
        type: string
      flags:
        type: string
    steps:
      - codecov/upload:
          # FIX 7: codecov orb v4 uses `file` (singular), not `files`.
          # Using the wrong key silently skips the upload.
          file: << parameters.report_path >>
          flags: << parameters.flags >>

  write_local_properties:
    steps:
      - run:
          name: Write local.properties
          command: |
            echo "sdk.dir=/android-sdk" > local.properties
            echo "maps_api_key=$MAPS_API_KEY" >> local.properties

  write_google_services:
    parameters:
      target_module:
        type: string
    steps:
      - run:
          name: Write google-services.json
          command: |
            # FIX 2: `echo` mangles JSON — it expands escape sequences and can
            # break on backticks, special characters, and multi-line content.
            # `printf '%s'` writes the value verbatim with no interpretation.
            printf '%s' "$GOOGLE_SERVICES_JSON" > << parameters.target_module >>/google-services.json

  # FIX 1 (shared helper): Extract submodule init into a reusable command so
  # every job that needs submodules uses the same safe implementation.
  checkout_with_submodules:
    steps:
      - checkout
      - run:
          name: Initialise git submodules
          command: git submodule update --init --recursive

  run_android_test:
    parameters:
      test_command:
        type: string
      report_path:
        type: string
      flags:
        type: string
    steps:
      - run:
          name: Run Android Test
          command: << parameters.test_command >>
      - codecov_upload:
          report_path: << parameters.report_path >>
          flags: << parameters.flags >>

  store_android_artifacts:
    parameters:
      module_path:
        type: string
    steps:
      - store_test_results:
          path: << parameters.module_path >>/build/test-results
      - store_artifacts:
          path: << parameters.module_path >>/build/reports

jobs:
  unit_test_ui:
    executor: *android_exec
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      # FIX 1: replaced `checkout: submodules: true` (invalid parameter) with
      # the new `checkout_with_submodules` command throughout all jobs.
      - checkout_with_submodules
      - android/restore_gradle_cache
      - run:
          name: UI unit tests
          command: |
            ./gradlew :module:ui:jacocoFdroidTestReport \
              --parallel \
              --max-workers 2 \
              -Dorg.gradle.jvmargs="-Xmx2048m"
      - codecov_upload:
          report_path: ./module/ui/build/reports/jacoco/unitTest.xml
          flags: ui-unitTest
      # FIX 4: store test results and reports so failures are visible in
      # CircleCI Insights and the Artifacts tab.
      - store_android_artifacts:
          module_path: ./module/ui
      - android/save_gradle_cache

  unit_test_data_repo_api:
    executor: *android_exec
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - checkout_with_submodules
      - android/restore_gradle_cache
      - run:
          name: Data repo api unit tests
          command: |
            ./gradlew :module:data-repo-api:jacocoFdroidTestReport \
              --parallel \
              --max-workers 2 \
              -Dorg.gradle.jvmargs="-Xmx2048m"
      - codecov_upload:
          report_path: ./module/data-repo-api/build/reports/jacoco/unitTest.xml
          flags: data-repo-api-unitTest
      # FIX 4: store test results and reports.
      - store_android_artifacts:
          module_path: ./module/data-repo-api
      - android/save_gradle_cache

  unit_test_data_common:
    executor: *android_exec
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - checkout_with_submodules
      - android/restore_gradle_cache
      - run:
          name: Data common unit tests
          command: |
            ./gradlew :module:data-common:jacocoFdroidTestReport \
              --parallel \
              --max-workers 2 \
              -Dorg.gradle.jvmargs="-Xmx2048m"
      - codecov_upload:
          report_path: ./module/data-common/build/reports/jacoco/unitTest.xml
          flags: data-common-unitTest
      # FIX 4: store test results and reports.
      - store_android_artifacts:
          module_path: ./module/data-common
      - android/save_gradle_cache

  ui_android_test:
    executor: *android_exec
    steps:
      - checkout_with_submodules
      - android/create_avd:
          avd_name: testavd
          system_image: system-images;android-36;google_apis;x86_64
          install: true
      - write_local_properties
      - write_google_services:
          target_module: app
      - android/start_emulator:
          avd_name: testavd
          no_window: true
          gpu: swiftshader_indirect
          restore_gradle_cache_prefix: v1a
      - run_android_test:
          test_command: ./gradlew :module:ui:connectedFdroidDebugAndroidTest --continue --parallel -Dorg.gradle.jvmargs="-Xmx2048m"
          report_path: ./module/ui/build/reports/coverage/androidTest/fdroid/debug/connected/report.xml
          flags: ui-androidTest
      - store_android_artifacts:
          module_path: ./module/ui
      # FIX 3: `restore_gradle_cache_prefix` on start_emulator restores cache
      # during boot, but without a matching save the cache is never written for
      # future runs. Add the save step after the work is done.
      - android/save_gradle_cache:
          cache_prefix: v1a

  app_android_test:
    executor: *android_exec
    steps:
      - checkout_with_submodules
      - android/create_avd:
          avd_name: testavd
          system_image: system-images;android-36;google_apis;x86_64
          install: true
      - write_local_properties
      - write_google_services:
          target_module: app
      - android/start_emulator:
          avd_name: testavd
          no_window: true
          gpu: swiftshader_indirect
          restore_gradle_cache_prefix: v1a
      - run_android_test:
          test_command: ./gradlew :app:connectedFdroidDebugAndroidTest --continue --parallel -Dorg.gradle.jvmargs="-Xmx2048m"
          report_path: ./app/build/reports/coverage/androidTest/fdroid/debug/connected/report.xml
          flags: app-androidTest
      - store_android_artifacts:
          module_path: ./app
      # FIX 3: matching cache save.
      - android/save_gradle_cache:
          cache_prefix: v1a

  data_common_android_test:
    executor: *android_exec
    steps:
      - checkout_with_submodules
      - android/create_avd:
          avd_name: testavd
          system_image: system-images;android-36;google_apis;x86_64
          install: true
      - write_local_properties
      - write_google_services:
          target_module: app
      - android/start_emulator:
          avd_name: testavd
          no_window: true
          gpu: swiftshader_indirect
          restore_gradle_cache_prefix: v1a
      - run_android_test:
          test_command: ./gradlew :module:data-common:connectedFdroidDebugAndroidTest --continue --parallel -Dorg.gradle.jvmargs="-Xmx2048m"
          report_path: ./module/data-common/build/reports/coverage/androidTest/fdroid/debug/connected/report.xml
          flags: data-common-androidTest
      - store_android_artifacts:
          module_path: ./module/data-common
      # FIX 3: matching cache save.
      - android/save_gradle_cache:
          cache_prefix: v1a

  detekt:
    executor: *android_exec
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dsonar.gradle.skipCompile=true"
    steps:
      - checkout_with_submodules
      - android/restore_gradle_cache
      - run:
          name: Detekt
          command: ./gradlew detekt --parallel
      # FIX 5: store detekt HTML/XML reports so they are accessible on failure.
      - store_artifacts:
          path: build/reports/detekt
      - android/save_gradle_cache

  ktlint:
    executor: *android_exec
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dsonar.gradle.skipCompile=true"
    steps:
      - checkout_with_submodules
      - android/restore_gradle_cache
      - run:
          name: Ktlint
          command: ./gradlew ktlintCheck --parallel
      # FIX 5: store ktlint reports.
      - store_artifacts:
          path: build/reports/ktlint
      - android/save_gradle_cache

  lint_fdroid_debug:
    executor: *android_exec
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - checkout_with_submodules
      - android/restore_gradle_cache
      - run:
          name: Lint Fdroid Debug
          command: ./gradlew lintFdroidDebug --parallel
      # FIX 5: store lint reports so lint failures can be inspected.
      - store_artifacts:
          path: app/build/reports/lint-results-fdroidDebug.html
      - android/save_gradle_cache

  sonarqube:
    executor: *android_exec
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - checkout_with_submodules
      - android/restore_gradle_cache
      - run:
          name: Sonarqube
          command: ./gradlew sonar -Dsonar.gradle.skipCompile=true
      - android/save_gradle_cache

workflows:
  codecov_and_static:
    jobs:
      - unit_test_ui
      - unit_test_data_repo_api
      - unit_test_data_common
      - ui_android_test
      - app_android_test
      - data_common_android_test
      - detekt
      - ktlint
      - lint_fdroid_debug
      - sonarqube:
          requires:
            - unit_test_ui
            - unit_test_data_repo_api
            - unit_test_data_common
